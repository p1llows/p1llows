    <text x="150" y="18" style="font:500 13px ui-monospace,monospace;letter-spacing:0.5px;fill:#24292f">
      PHP <tspan fill="#afb8c1">·</tspan> TypeScript <tspan fill="#afb8c1">·</tspan> JavaScript <tspan fill="#afb8c1">·</tspan> SQL <tspan fill="#afb8c1">·</tspan> Bash <tspan fill="#afb8c1">·</tspan> HTML5 <tspan fill="#afb8c1">·</tspan> CSS3
    </text>
  </g>
  <line x1="30" y1="62" x2="830" y2="62" stroke="#eaeef2" stroke-width="1"/>

