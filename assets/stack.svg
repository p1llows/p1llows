      Laravel <tspan fill="#afb8c1">·</tspan> Node.js <tspan fill="#afb8c1">·</tspan> Express.js <tspan fill="#afb8c1">·</tspan> RESTful APIs <tspan fill="#afb8c1">·</tspan> Blade
    </text>
  </g>
  <line x1="30" y1="112" x2="830" y2="112" stroke="#eaeef2" stroke-width="1"/>

  <!-- Row 3: Frontend -->
  <g transform="translate(30, 142)">
    <rect width="130" height="26" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
    <text x="65" y="17" text-anchor="middle" style="font:600 11px ui-monospace,monospace;letter-spacing:1.5px;fill:#57606a">FRONTEND</text>
    <text x="150" y="18" style="font:500 13px ui-monospace,monospace;letter-spacing:0.5px;fill:#24292f">
