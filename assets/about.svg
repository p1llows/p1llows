<svg width="860" height="245" viewBox="0 0 860 245" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="about-border-light" x1="0" y1="0" x2="860" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d0d7de"/>
      <stop offset="50%" stop-color="#eaeef2"/>
      <stop offset="100%" stop-color="#d0d7de"/>
    </linearGradient>
    <linearGradient id="scanline-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eaeef2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#eaeef2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    @keyframes sweep {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(860px); }
    }
    .status-dot {
      animation: pulse 2.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .beam {
      animation: sweep 4.5s linear infinite;
    }
  </style>

  <!-- Outer Card Container -->
  <rect width="860" height="245" rx="10" fill="#ffffff" stroke="url(#about-border-light)" stroke-width="1.2"/>

  <!-- Top System Bar -->
  <circle cx="28" cy="20" r="4" fill="#d0d7de"/>
  <circle cx="42" cy="20" r="4" fill="#eaeef2"/>
  <circle cx="56" cy="20" r="4" fill="#eaeef2"/>

  <text x="75" y="24" style="font:600 10.5px ui-monospace,monospace;letter-spacing:2px;fill:#6e7681">KERNEL // PROFILE.BIOGRAPHY</text>


  <!-- Lead Description -->
  <g transform="translate(25, 48)">
    <text x="0" y="0" style="font:600 15px 'Segoe UI',-apple-system,'Helvetica Neue',sans-serif;letter-spacing:0.3px;fill:#0d1117">
      Full-stack developer architecting production web apps, robust backend APIs &amp; distributed systems.
    </text>
    <text x="0" y="22" style="font:400 13px 'Segoe UI',sans-serif;fill:#57606a">
      Computer Science graduate based in Baguio City, Philippines. Passionate about performant architectures and developer tooling.
    </text>
  </g>

  <!-- Divider Line with Sweeping Beam -->
  <line x1="20" y1="88" x2="840" y2="88" stroke="#eaeef2" stroke-width="1"/>
  <g clip-path="url(#about-divider-clip-light)">
    <clipPath id="about-divider-clip-light">
      <rect x="20" y="87" width="820" height="2"/>
    </clipPath>
    <rect class="beam" x="0" y="87" width="300" height="2" fill="url(#scanline-light)"/>
  </g>

  <!-- Core Pillars (4 Rows with Terminal Badges) -->
  <g transform="translate(25, 114)">
    <!-- Row 1: Full-Stack Core -->
    <g transform="translate(0, 0)">
      <rect width="125" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <circle class="status-dot" cx="10" cy="11" r="2.5" fill="#0d1117"/>
      <text x="18" y="14.5" style="font:700 9px ui-monospace,monospace;letter-spacing:1px;fill:#24292f">FULL-STACK</text>
      <text x="140" y="15" style="font:400 13px 'Segoe UI',sans-serif;fill:#24292f">
        Building scalable full-stack applications with <tspan font-weight="600" fill="#0d1117">Laravel, React &amp; Next.js</tspan>
      </text>
    </g>

    <!-- Row 2: Database and Scale -->
    <g transform="translate(0, 32)">
      <rect width="125" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <circle class="status-dot" cx="10" cy="11" r="2.5" fill="#0d1117"/>
      <text x="18" y="14.5" style="font:700 9px ui-monospace,monospace;letter-spacing:1px;fill:#24292f">DATABASES</text>
      <text x="140" y="15" style="font:400 13px 'Segoe UI',sans-serif;fill:#24292f">
        Relational &amp; NoSQL schema design, query optimization &amp; caching with <tspan font-weight="600" fill="#0d1117">PostgreSQL, MySQL &amp; Redis</tspan>
      </text>
    </g>

    <!-- Row 3: AI Workflows -->
    <g transform="translate(0, 64)">
      <rect width="125" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <circle class="status-dot" cx="10" cy="11" r="2.5" fill="#0d1117"/>
      <text x="18" y="14.5" style="font:700 9px ui-monospace,monospace;letter-spacing:1px;fill:#24292f">AI WORKFLOW</text>
      <text x="140" y="15" style="font:400 13px 'Segoe UI',sans-serif;fill:#24292f">
        Researching <tspan font-weight="600" fill="#0d1117">AI-assisted software development</tspan>, autonomous agents &amp; LLM workflows
      </text>
    </g>

    <!-- Row 4: DevOps and Infra -->
    <g transform="translate(0, 96)">
      <rect width="125" height="22" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
      <circle class="status-dot" cx="10" cy="11" r="2.5" fill="#0d1117"/>
      <text x="18" y="14.5" style="font:700 9px ui-monospace,monospace;letter-spacing:1px;fill:#24292f">CONTAINERS</text>
      <text x="140" y="15" style="font:400 13px 'Segoe UI',sans-serif;fill:#24292f">
        Shipping containerized cloud deployments with <tspan font-weight="600" fill="#0d1117">Docker, Vercel &amp; GitHub Actions</tspan>
      </text>
    </g>
  </g>
</svg>