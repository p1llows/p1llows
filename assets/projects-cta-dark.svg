<svg width="860" height="48" viewBox="0 0 860 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Explore all production projects on the portfolio">
  <style>
    @keyframes ping {
      0%        { transform: scale(1);   opacity: 0.5; }
      70%, 100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.7; }
    }
    .ring, .core { transform-box: fill-box; transform-origin: center; }
    .ring { animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .core { animation: breathe 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .ring { animation: none; opacity: 0; }
      .core { animation: none; }
    }
  </style>

  <rect x="0.6" y="0.6" width="858.8" height="46.8" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

  <circle class="ring" cx="28" cy="24" r="3.5" fill="#f0f6fc"/>
  <circle class="core" cx="28" cy="24" r="3.5" fill="#f0f6fc"/>

  <text x="44" y="28" style="font:600 11px ui-monospace,'Cascadia Code','JetBrains Mono',monospace;letter-spacing:2px;fill:#8b949e">ALL PRODUCTION PROJECTS</text>
  <text x="832" y="28" text-anchor="end" style="font:700 11px ui-monospace,'Cascadia Code','JetBrains Mono',monospace;letter-spacing:2px;fill:#f0f6fc">EXPLORE PORTFOLIO &#8594;</text>
</svg>
