<svg width="860" height="245" viewBox="0 0 860 245" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <linearGradient id="about-border-dark" x1="0" y1="0" x2="860" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="scanline-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f0f6fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    @keyframes sweep {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(860px); }
    }
    .status-dot {
      animation: pulse 2.2s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .beam {
      animation: sweep 4.5s linear infinite;
    }
  </style>

  <!-- Outer Card Container -->
  <rect width="860" height="245" rx="10" fill="#0d1117" stroke="url(#about-border-dark)" stroke-width="1.2"/>

  <!-- Top System Bar -->
  <circle cx="28" cy="20" r="4" fill="#30363d"/>
  <circle cx="42" cy="20" r="4" fill="#21262d"/>
  <circle cx="56" cy="20" r="4" fill="#21262d"/>

  <text x="75" y="24" style="font:600 10.5px ui-monospace,monospace;letter-spacing:2px;fill:#6e7681">KERNEL // PROFILE.BIOGRAPHY</text>


  <!-- Lead Description -->
  <g transform="translate(25, 48)">
    <text x="0" y="0" style="font:600 15px 'Segoe UI',-apple-system,'Helvetica Neue',sans-serif;letter-spacing:0.3px;fill:#f0f6fc">
      Full-stack developer architecting production web apps, robust backend APIs &amp; distributed systems.
    </text>
    <text x="0" y="22" style="font:400 13px 'Segoe UI',sans-serif;fill:#8b949e">
      Computer Science graduate based in Baguio City, Philippines. Passionate about performant architectures and developer tooling.
    </text>
  </g>

  <!-- Divider Line with Sweeping Beam -->
  <line x1="20" y1="88" x2="840" y2="88" stroke="#21262d" stroke-width="1"/>
  <g clip-path="url(#about-divider-clip-dark)">
    <clipPath id="about-divider-clip-dark">
      <rect x="20" y="87" width="820" height="2"/>
    </clipPath>
    <rect class="beam" x="0" y="87" width="300" height="2" fill="url(#scanline-dark)"/>
  </g>

  <!-- Core Pillars (4 Rows with Terminal Badges) -->
  <g transform="translate(25, 114)">
    <!-- Row 1: Full-Stack Core -->
    <g transform="translate(0, 0)">
      <rect width="125" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle class="status-dot" cx="10" cy="11" r="2.5" fill="#f0f6fc"/>
      <text x="18" y="14.5" style="font:700 9px ui-monospace,monospace;letter-spacing:1px;fill:#c9d1d9">FULL-STACK</text>
      <text x="140" y="15" style="font:400 13px 'Segoe UI',sans-serif;fill:#c9d1d9">
        Building scalable full-stack applications with <tspan font-weight="600" fill="#f0f6fc">Laravel, React &amp; Next.js</tspan>
      </text>
    </g>

    <!-- Row 2: Database and Scale -->
    <g transform="translate(0, 32)">
      <rect width="125" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle class="status-dot" cx="10" cy="11" r="2.5" fill="#f0f6fc"/>
      <text x="18" y="14.5" style="font:700 9px ui-monospace,monospace;letter-spacing:1px;fill:#c9d1d9">DATABASES</text>
      <text x="140" y="15" style="font:400 13px 'Segoe UI',sans-serif;fill:#c9d1d9">
        Relational &amp; NoSQL schema design, query optimization &amp; caching with <tspan font-weight="600" fill="#f0f6fc">PostgreSQL, MySQL &amp; Redis</tspan>
      </text>
    </g>

    <!-- Row 3: AI Workflows -->
    <g transform="translate(0, 64)">
      <rect width="125" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle class="status-dot" cx="10" cy="11" r="2.5" fill="#f0f6fc"/>
      <text x="18" y="14.5" style="font:700 9px ui-monospace,monospace;letter-spacing:1px;fill:#c9d1d9">AI WORKFLOW</text>
      <text x="140" y="15" style="font:400 13px 'Segoe UI',sans-serif;fill:#c9d1d9">
        Researching <tspan font-weight="600" fill="#f0f6fc">AI-assisted software development</tspan>, autonomous agents &amp; LLM workflows
      </text>
    </g>

    <!-- Row 4: DevOps and Infra -->
    <g transform="translate(0, 96)">
      <rect width="125" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle class="status-dot" cx="10" cy="11" r="2.5" fill="#f0f6fc"/>
      <text x="18" y="14.5" style="font:700 9px ui-monospace,monospace;letter-spacing:1px;fill:#c9d1d9">CONTAINERS</text>
      <text x="140" y="15" style="font:400 13px 'Segoe UI',sans-serif;fill:#c9d1d9">
        Shipping containerized cloud deployments with <tspan font-weight="600" fill="#f0f6fc">Docker, Vercel &amp; GitHub Actions</tspan>
      </text>
    </g>
  </g>
</svg>