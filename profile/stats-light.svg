  <style>
    @keyframes fadeInAnimation {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleInAnimation {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes rankAnimation {
      from { stroke-dashoffset: 251.32; }
      to { stroke-dashoffset: 75.39; }
    }
    .header {
      font: 600 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      fill: #0d1117;
      letter-spacing: 0.5px;
      animation: fadeInAnimation 0.6s ease-in-out forwards;
    }
    .stat {
      font: 500 13px ui-monospace, 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
      fill: #57606a;
    }
    .bold {
      font-weight: 700;
      fill: #0d1117;
    }
    .icon {
      fill: #57606a;
    }
    .rank-text {
      font: 800 24px 'Segoe UI', -apple-system, sans-serif;
      fill: #0d1117;
      transform-origin: center;
      animation: scaleInAnimation 0.5s ease-out 0.4s forwards;
    }
    .rank-circle-rim {
      stroke: #eaeef2;
      fill: none;
      stroke-width: 5;
    }
    .rank-circle {
      stroke: #0d1117;
      stroke-dasharray: 251.32;
      stroke-dashoffset: 251.32;
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      transform-origin: -10px 8px;
      transform: rotate(-90deg);
      animation: rankAnimation 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.2s;
    }
    .card-border {
      stroke: #d0d7de;
      stroke-width: 1;
    }
    .stagger-1 { animation: fadeInAnimation 0.5s ease-out forwards 0.15s; opacity: 0; }
    .stagger-2 { animation: fadeInAnimation 0.5s ease-out forwards 0.3s; opacity: 0; }
    .stagger-3 { animation: fadeInAnimation 0.5s ease-out forwards 0.45s; opacity: 0; }
    .stagger-4 { animation: fadeInAnimation 0.5s ease-out forwards 0.6s; opacity: 0; }
    .stagger-5 { animation: fadeInAnimation 0.5s ease-out forwards 0.75s; opacity: 0; }
  </style>

