<svg
  width="467"
  height="195"
  viewBox="0 0 467 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Jewel Ramirez&#39;s Most Used Languages</title>
  <desc id="descId">TypeScript: 47.22%, PHP: 38.60%, Blade: 10.57%, JavaScript: 2.53%, CSS: 0.81%, Shell: 0.13%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #e6edf3;
    }
    .lang-name {
      font: 400 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #8b949e;
    }
    .lang-pct {
      font-weight: 700;
      fill: #e6edf3;
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    width="466"
    fill="#00000000"
    stroke-opacity="0"
  />

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Segmented monochrome progress bar (width 417 matches card proportion) -->
  <g transform="translate(25, 50)">
    <clipPath id="lang-bar-clip-dark">
      <rect x="0" y="0" width="417" height="8" rx="4" />
    </clipPath>
    <g clip-path="url(#lang-bar-clip-dark)">
      <rect x="0.0" y="0" width="196.9" height="8" fill="#e6edf3" />
      <rect x="196.9" y="0" width="161.0" height="8" fill="#8b949e" />
      <rect x="357.9" y="0" width="44.1" height="8" fill="#57606a" />
      <rect x="402.0" y="0" width="10.6" height="8" fill="#484f58" />
      <rect x="412.6" y="0" width="4.4" height="8" fill="#38404a" />
    </g>
  </g>

  <!-- Language List (2 Columns matching GitHub Stats card dimensions and typography) -->
  <g transform="translate(25, 78)">
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#e6edf3" />
      <text x="18" y="9" class="lang-name">TypeScript <tspan class="lang-pct">47.22%</tspan></text>
    </g>
    <g transform="translate(0, 24)">
      <circle cx="5" cy="5" r="4.5" fill="#8b949e" />
      <text x="18" y="9" class="lang-name">PHP <tspan class="lang-pct">38.60%</tspan></text>
    </g>
    <g transform="translate(0, 48)">
      <circle cx="5" cy="5" r="4.5" fill="#57606a" />
      <text x="18" y="9" class="lang-name">Blade <tspan class="lang-pct">10.57%</tspan></text>
    </g>
    <g transform="translate(0, 72)">
      <circle cx="5" cy="5" r="4.5" fill="#484f58" />
      <text x="18" y="9" class="lang-name">JavaScript <tspan class="lang-pct">2.53%</tspan></text>
    </g>
    <g transform="translate(215, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#38404a" />
      <text x="18" y="9" class="lang-name">CSS <tspan class="lang-pct">0.81%</tspan></text>
    </g>
    <g transform="translate(215, 24)">
      <circle cx="5" cy="5" r="4.5" fill="#30363d" />
      <text x="18" y="9" class="lang-name">Shell <tspan class="lang-pct">0.13%</tspan></text>
    </g>
    <g transform="translate(215, 48)">
      <circle cx="5" cy="5" r="4.5" fill="#282e35" />
      <text x="18" y="9" class="lang-name">Dockerfile <tspan class="lang-pct">0.11%</tspan></text>
    </g>
    <g transform="translate(215, 72)">
      <circle cx="5" cy="5" r="4.5" fill="#21262d" />
      <text x="18" y="9" class="lang-name">HTML <tspan class="lang-pct">0.05%</tspan></text>
    </g>
  </g>
</svg>