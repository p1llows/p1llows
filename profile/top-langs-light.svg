<svg
  width="467"
  height="195"
  viewBox="0 0 467 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Jewel Ramirez&#39;s Most Used Languages</title>
  <desc id="descId">TypeScript: 46.48%, PHP: 39.14%, Blade: 10.57%, JavaScript: 2.24%, CSS: 1.17%, Dockerfile: 0.20%</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #0d1117;
    }
    .lang-name {
      font: 400 13px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #57606a;
    }
    .lang-pct {
      font-weight: 700;
      fill: #0d1117;
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    width="466"
    fill="#00000000"
    stroke-opacity="0"
  />

  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>

  <!-- Segmented monochrome progress bar (width 417 matches card proportion) -->
  <g transform="translate(25, 50)">
    <clipPath id="lang-bar-clip-light">
      <rect x="0" y="0" width="417" height="8" rx="4" />
    </clipPath>
    <g clip-path="url(#lang-bar-clip-light)">
      <rect x="0.0" y="0" width="193.8" height="8" fill="#0d1117" />
      <rect x="193.8" y="0" width="163.2" height="8" fill="#57606a" />
      <rect x="357.0" y="0" width="44.1" height="8" fill="#8c959f" />
      <rect x="401.1" y="0" width="9.3" height="8" fill="#afb8c1" />
      <rect x="410.4" y="0" width="6.6" height="8" fill="#c0c7cf" />
    </g>
  </g>

  <!-- Language List (2 Columns matching GitHub Stats card dimensions and typography) -->
  <g transform="translate(25, 78)">
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#0d1117" />
      <text x="18" y="9" class="lang-name">TypeScript <tspan class="lang-pct">46.48%</tspan></text>
    </g>
    <g transform="translate(0, 24)">
      <circle cx="5" cy="5" r="4.5" fill="#57606a" />
      <text x="18" y="9" class="lang-name">PHP <tspan class="lang-pct">39.14%</tspan></text>
    </g>
    <g transform="translate(0, 48)">
      <circle cx="5" cy="5" r="4.5" fill="#8c959f" />
      <text x="18" y="9" class="lang-name">Blade <tspan class="lang-pct">10.57%</tspan></text>
    </g>
    <g transform="translate(0, 72)">
      <circle cx="5" cy="5" r="4.5" fill="#afb8c1" />
      <text x="18" y="9" class="lang-name">JavaScript <tspan class="lang-pct">2.24%</tspan></text>
    </g>
    <g transform="translate(215, 0)">
      <circle cx="5" cy="5" r="4.5" fill="#c0c7cf" />
      <text x="18" y="9" class="lang-name">CSS <tspan class="lang-pct">1.17%</tspan></text>
    </g>
    <g transform="translate(215, 24)">
      <circle cx="5" cy="5" r="4.5" fill="#d0d7de" />
      <text x="18" y="9" class="lang-name">Dockerfile <tspan class="lang-pct">0.20%</tspan></text>
    </g>
    <g transform="translate(215, 48)">
      <circle cx="5" cy="5" r="4.5" fill="#d8dee4" />
      <text x="18" y="9" class="lang-name">Shell <tspan class="lang-pct">0.11%</tspan></text>
    </g>
    <g transform="translate(215, 72)">
      <circle cx="5" cy="5" r="4.5" fill="#eaeef2" />
      <text x="18" y="9" class="lang-name">HTML <tspan class="lang-pct">0.09%</tspan></text>
    </g>
  </g>
</svg>